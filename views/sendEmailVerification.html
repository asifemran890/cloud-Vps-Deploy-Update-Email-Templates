<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="x-apple-disable-message-reformatting" />
    <title>${headerCategory}</title>

    <style>
      @media only screen and (max-width: 600px) {
        .email-wrapper {
          padding: 16px 8px !important;
        }
        .email-card {
          border-radius: 8px !important;
        }
        .email-content {
          padding: 28px 20px !important;
        }
        .email-header {
          padding: 24px 20px 16px 20px !important;
        }
        .otp-display {
          font-size: 28px !important;
          letter-spacing: 6px !important;
        }
      }
    </style>
  </head>
  <body style="background-color: #f3f4f6; padding: 2rem; font-family: Arial, sans-serif; color: #333;">
    <body style="margin: 0; padding: 20px; background-color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <div style="max-width: 32rem; margin: 0 auto; background-color: #ffffff; padding: 2.5rem 2rem; border-radius: 0.75rem; box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08); text-align: center; border: 1px solid #e5e7eb;">
    
    <!-- Logo -->
    <img src="https://raw.githubusercontent.com/shadat-hossan/Image-server/refs/heads/main/NEXMOTAG.jpeg" 
         alt="NEXMO TAG Logo" 
         style="max-width: 9rem; height: auto; margin-bottom: 1.5rem; display: inline-block;">
    
    <!-- Header with Dynamic User Name -->
    <h1 style="font-size: 1.65rem; font-weight: 700; margin: 0 0 0.75rem 0; color: #111827; line-height: 1.2;">
      Welcome, ${name}! 👋
    </h1>
    
    <!-- Description -->
    <p style="color: #4b5563; font-size: 1rem; line-height: 1.5; margin: 0 0 1.75rem 0;">
      Thank you for joining NEXMO TAG! Your account is almost ready. Please use the verification code below to complete your registration:
    </p>
    
    <!-- OTP Code Box -->
    <div style="background: linear-gradient(135deg, #2563eb, #0891b2); color: #ffffff; padding: 1.25rem; border-radius: 0.5rem; font-size: 2.25rem; font-weight: 800; letter-spacing: 0.25rem; margin-bottom: 1rem; text-shadow: 0 1px 2px rgba(0,0,0,0.1);">
      ${otp}
    </div>
    
    <!-- Expiration Warning -->
    <p style="color: #dc2626; font-size: 0.875rem; font-weight: 500; margin: 0 0 2rem 0;">
      ⏱️ This code expires in <strong>3 minutes</strong>.
    </p>
    
    <!-- Divider -->
    <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 1.5rem 0;">
    
    <!-- Footer -->
    <p style="margin: 0; font-size: 0.75rem; color: #6b7280;">
      Developed by 
      <a href="https://shadat-hossain.netlify.app" 
         style="color: #2563eb; text-decoration: none; font-weight: 600;" 
         target="_blank">
        Md. Asif Emran
      </a>
    </p>
    
  </div>
</html>
